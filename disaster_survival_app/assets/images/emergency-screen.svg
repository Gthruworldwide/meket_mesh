<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E27A"/><stop offset=".5" stop-color="#D4AF37"/><stop offset="1" stop-color="#8A6D1A"/>
    </linearGradient>
    <radialGradient id="bg" cx=".5" cy=".5" r=".9">
      <stop offset="0" stop-color="#1F1418"/><stop offset="1" stop-color="#0F141C"/>
    </radialGradient>
    <radialGradient id="sos" cx=".5" cy=".4" r=".7">
      <stop offset="0" stop-color="#FF6B6B"/><stop offset="1" stop-color="#C21818"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- top status bar -->
  <g font-family="Tahoma, Arial, sans-serif" fill="#E8EAED">
    <rect x="60" y="90" width="460" height="130" rx="28" fill="#161D28" stroke="#D4AF37" stroke-opacity=".5" stroke-width="2"/>
    <text x="290" y="150" text-anchor="middle" font-size="40" font-weight="700" fill="#D4AF37">87%</text>
    <text x="290" y="196" text-anchor="middle" direction="rtl" font-size="30" fill="#9AA4B2">البطارية</text>
    <rect x="560" y="90" width="460" height="130" rx="28" fill="#161D28" stroke="#22D3EE" stroke-opacity=".5" stroke-width="2"/>
    <text x="790" y="150" text-anchor="middle" font-size="40" font-weight="700" fill="#22D3EE">5</text>
    <text x="790" y="196" text-anchor="middle" direction="rtl" font-size="30" fill="#9AA4B2">أجهزة متصلة</text>
  </g>

  <!-- title -->
  <text x="540" y="340" text-anchor="middle" direction="rtl" font-family="Tahoma, Arial, sans-serif" font-size="64" font-weight="700" fill="#FF3B3B" filter="url(#glow)">وضع الطوارئ</text>
  <text x="540" y="410" text-anchor="middle" direction="rtl" font-family="Tahoma, Arial, sans-serif" font-size="36" fill="#9AA4B2">اضغط مطولًا لإرسال نداء استغاثة عبر الشبكة</text>

  <!-- pulse rings -->
  <g fill="none" stroke="#FF3B3B" stroke-width="4">
    <circle cx="540" cy="940" r="330" opacity=".12"/>
    <circle cx="540" cy="940" r="410" opacity=".08"/>
    <circle cx="540" cy="940" r="490" opacity=".05"/>
  </g>

  <!-- SOS button -->
  <circle cx="540" cy="940" r="270" fill="url(#sos)" filter="url(#glow)"/>
  <circle cx="540" cy="940" r="270" fill="none" stroke="#FFB3B3" stroke-width="6" opacity=".6"/>
  <text x="540" y="990" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="170" font-weight="900" letter-spacing="8" fill="#fff">SOS</text>

  <!-- info cards -->
  <g font-family="Tahoma, Arial, sans-serif">
    <rect x="60" y="1340" width="960" height="130" rx="28" fill="#161D28" stroke="#FF3B3B" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="960" cy="1405" r="14" fill="#FF3B3B" filter="url(#glow)"/>
    <text x="920" y="1418" text-anchor="end" direction="rtl" font-size="40" fill="#E8EAED">جارٍ البث عبر Bluetooth Mesh</text>
    <rect x="60" y="1500" width="960" height="130" rx="28" fill="#161D28" stroke="#22D3EE" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="960" cy="1565" r="14" fill="#22D3EE" filter="url(#glow)"/>
    <text x="920" y="1578" text-anchor="end" direction="rtl" font-size="40" fill="#E8EAED">Wi-Fi Direct جاهز للاتصال</text>
  </g>

  <!-- bottom actions -->
  <g font-family="Tahoma, Arial, sans-serif" font-size="38" text-anchor="middle">
    <rect x="60" y="1720" width="460" height="110" rx="55" fill="none" stroke="#D4AF37" stroke-width="3"/>
    <text x="290" y="1788" direction="rtl" fill="#D4AF37">البوصلة وضوء الاستغاثة</text>
    <rect x="560" y="1720" width="460" height="110" rx="55" fill="url(#g)"/>
    <text x="790" y="1788" direction="rtl" fill="#0F141C" font-weight="700">الفرز الطبي</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
