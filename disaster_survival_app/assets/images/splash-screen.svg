<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E27A"/><stop offset=".5" stop-color="#D4AF37"/><stop offset="1" stop-color="#8A6D1A"/>
    </linearGradient>
    <radialGradient id="bg" cx=".5" cy=".4" r=".9">
      <stop offset="0" stop-color="#1B2432"/><stop offset="1" stop-color="#0F141C"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- background mesh -->
  <g stroke="#D4AF37" stroke-width="2" opacity=".18">
    <line x1="80" y1="200" x2="300" y2="380"/><line x1="300" y1="380" x2="620" y2="260"/>
    <line x1="620" y1="260" x2="940" y2="420"/><line x1="300" y1="380" x2="200" y2="700"/>
    <line x1="940" y1="420" x2="880" y2="760"/><line x1="200" y1="700" x2="120" y2="1100"/>
    <line x1="880" y1="760" x2="960" y2="1180"/><line x1="120" y1="1100" x2="340" y2="1500"/>
    <line x1="960" y1="1180" x2="760" y2="1560"/><line x1="340" y1="1500" x2="760" y2="1560"/>
    <line x1="340" y1="1500" x2="180" y2="1780"/><line x1="760" y1="1560" x2="920" y2="1800"/>
  </g>
  <g fill="#D4AF37" opacity=".35">
    <circle cx="80" cy="200" r="8"/><circle cx="300" cy="380" r="10"/><circle cx="620" cy="260" r="8"/>
    <circle cx="940" cy="420" r="10"/><circle cx="200" cy="700" r="8"/><circle cx="880" cy="760" r="8"/>
    <circle cx="120" cy="1100" r="10"/><circle cx="960" cy="1180" r="8"/><circle cx="340" cy="1500" r="10"/>
    <circle cx="760" cy="1560" r="8"/><circle cx="180" cy="1780" r="8"/><circle cx="920" cy="1800" r="10"/>
  </g>

  <!-- signal rings -->
  <g fill="none" stroke="#22D3EE" stroke-width="3">
    <circle cx="540" cy="820" r="330" opacity=".15"/>
    <circle cx="540" cy="820" r="420" opacity=".10"/>
    <circle cx="540" cy="820" r="510" opacity=".06"/>
  </g>

  <!-- shield -->
  <g transform="translate(540 820) scale(.78) translate(-512 -515)">
    <path d="M512 120 L800 230 V500 C800 700 680 840 512 910 C344 840 224 700 224 500 V230 Z" fill="url(#g)"/>
    <path d="M512 160 L762 255 V500 C762 676 660 800 512 866 C364 800 262 676 262 500 V255 Z" fill="#0F141C"/>
    <g stroke="#D4AF37" stroke-width="6" opacity=".85" filter="url(#glow)">
      <line x1="512" y1="500" x2="512" y2="330"/><line x1="512" y1="500" x2="380" y2="430"/>
      <line x1="512" y1="500" x2="644" y2="430"/><line x1="512" y1="500" x2="400" y2="640"/>
      <line x1="512" y1="500" x2="624" y2="640"/><line x1="512" y1="330" x2="380" y2="430"/>
      <line x1="512" y1="330" x2="644" y2="430"/><line x1="400" y1="640" x2="624" y2="640"/>
    </g>
    <g fill="#F6E27A" filter="url(#glow)">
      <circle cx="512" cy="500" r="30"/><circle cx="512" cy="330" r="17"/><circle cx="380" cy="430" r="17"/>
      <circle cx="644" cy="430" r="17"/><circle cx="400" cy="640" r="17"/><circle cx="624" cy="640" r="17"/>
    </g>
  </g>

  <!-- title -->
  <text x="540" y="1300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="700" letter-spacing="10" fill="url(#g)">MEKET MESH</text>
  <text x="540" y="1390" text-anchor="middle" direction="rtl" font-family="Tahoma, Arial, sans-serif" font-size="46" fill="#E8EAED">تواصل بلا شبكة… حين تنقطع كل السبل</text>

  <!-- SOS badge -->
  <g transform="translate(540 1560)">
    <rect x="-130" y="-44" width="260" height="88" rx="44" fill="none" stroke="#FF3B3B" stroke-width="4" filter="url(#glow)"/>
    <circle cx="-80" cy="0" r="10" fill="#FF3B3B" filter="url(#glow)"/>
    <text x="20" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="6" fill="#FF3B3B">SOS READY</text>
  </g>

  <!-- loading bar -->
  <rect x="340" y="1700" width="400" height="6" rx="3" fill="#1B2432"/>
  <rect x="340" y="1700" width="260" height="6" rx="3" fill="url(#g)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
