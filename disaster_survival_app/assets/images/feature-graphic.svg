<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E27A"/><stop offset=".5" stop-color="#D4AF37"/><stop offset="1" stop-color="#8A6D1A"/>
    </linearGradient>
    <radialGradient id="bg" cx=".25" cy=".5" r=".9">
      <stop offset="0" stop-color="#1B2432"/><stop offset="1" stop-color="#0F141C"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- background mesh -->
  <g stroke="#D4AF37" stroke-width="1.5" opacity=".15">
    <line x1="20" y1="60" x2="160" y2="140"/><line x1="160" y1="140" x2="320" y2="40"/>
    <line x1="320" y1="40" x2="480" y2="110"/><line x1="160" y1="140" x2="90" y2="330"/>
    <line x1="90" y1="330" x2="260" y2="450"/><line x1="480" y1="110" x2="560" y2="300"/>
    <line x1="260" y1="450" x2="440" y2="400"/><line x1="440" y1="400" x2="560" y2="300"/>
  </g>
  <g fill="#D4AF37" opacity=".3">
    <circle cx="20" cy="60" r="5"/><circle cx="160" cy="140" r="6"/><circle cx="320" cy="40" r="5"/>
    <circle cx="480" cy="110" r="6"/><circle cx="90" cy="330" r="5"/><circle cx="260" cy="450" r="6"/>
    <circle cx="440" cy="400" r="5"/><circle cx="560" cy="300" r="6"/>
  </g>

  <!-- shield logo -->
  <g transform="translate(220 250) scale(.26) translate(-512 -515)">
    <path d="M512 120 L800 230 V500 C800 700 680 840 512 910 C344 840 224 700 224 500 V230 Z" fill="url(#g)"/>
    <path d="M512 160 L762 255 V500 C762 676 660 800 512 866 C364 800 262 676 262 500 V255 Z" fill="#0F141C"/>
    <g stroke="#D4AF37" stroke-width="8" opacity=".85">
      <line x1="512" y1="500" x2="512" y2="330"/><line x1="512" y1="500" x2="380" y2="430"/>
      <line x1="512" y1="500" x2="644" y2="430"/><line x1="512" y1="500" x2="400" y2="640"/>
      <line x1="512" y1="500" x2="624" y2="640"/><line x1="512" y1="330" x2="380" y2="430"/>
      <line x1="512" y1="330" x2="644" y2="430"/><line x1="400" y1="640" x2="624" y2="640"/>
    </g>
    <g fill="#F6E27A">
      <circle cx="512" cy="500" r="32"/><circle cx="512" cy="330" r="19"/><circle cx="380" cy="430" r="19"/>
      <circle cx="644" cy="430" r="19"/><circle cx="400" cy="640" r="19"/><circle cx="624" cy="640" r="19"/>
    </g>
  </g>
  <text x="220" y="425" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="5" fill="url(#g)">MEKET MESH</text>

  <!-- phone -->
  <g transform="translate(560 40)">
    <rect x="0" y="0" width="190" height="420" rx="30" fill="#161D28" stroke="#D4AF37" stroke-width="3"/>
    <rect x="12" y="14" width="166" height="392" rx="22" fill="#0F141C"/>
    <circle cx="95" cy="190" r="52" fill="#FF3B3B" filter="url(#glow)"/>
    <text x="95" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#fff">SOS</text>
    <g fill="none" stroke="#22D3EE" stroke-width="3">
      <path d="M70 100 A70 70 0 0 1 120 100" opacity=".9"/><path d="M52 80 A100 100 0 0 1 138 80" opacity=".5"/>
    </g>
    <rect x="30" y="285" width="130" height="30" rx="15" fill="#161D28" stroke="#22D3EE" stroke-opacity=".6"/>
    <rect x="30" y="330" width="130" height="30" rx="15" fill="#161D28" stroke="#D4AF37" stroke-opacity=".6"/>
  </g>

  <!-- signal arcs from phone -->
  <g fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round">
    <path d="M520 230 A60 60 0 0 0 520 270" opacity=".9"/>
    <path d="M495 210 A95 95 0 0 0 495 290" opacity=".55"/>
    <path d="M470 190 A130 130 0 0 0 470 310" opacity=".3"/>
  </g>

  <!-- Arabic headline -->
  <g font-family="Tahoma, Arial, sans-serif" text-anchor="end" direction="rtl">
    <text x="985" y="200" font-size="54" font-weight="700" fill="#E8EAED">تواصل بلا شبكة</text>
    <text x="985" y="268" font-size="54" font-weight="700" fill="#D4AF37">وقت الطوارئ</text>
    <text x="985" y="330" font-size="26" fill="#9AA4B2">استغاثة • فرز طبي • بوصلة • حاسبة مؤن</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
